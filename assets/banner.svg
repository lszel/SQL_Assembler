<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161531"/>
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Postgres Neon Gradient -->
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Accent Gold Gradient for Pins -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="circuitGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="360" rx="16" fill="url(#circuitGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#cyanGlow)"/>
  <circle cx="750" cy="180" r="140" fill="#6366f1" opacity="0.12" filter="url(#cyanGlow)"/>

  <!-- Left: Silicon Chip / CPU Visual -->
  <g transform="translate(60, 60)">
    <!-- CPU Outer Pins (Left & Right & Top & Bottom) -->
    <!-- Pins Left -->
    <g fill="url(#goldGrad)">
      <rect x="18" y="50" width="14" height="6" rx="2"/>
      <rect x="18" y="70" width="14" height="6" rx="2"/>
      <rect x="18" y="90" width="14" height="6" rx="2"/>
      <rect x="18" y="110" width="14" height="6" rx="2"/>
      <rect x="18" y="130" width="14" height="6" rx="2"/>
      <rect x="18" y="150" width="14" height="6" rx="2"/>
      <rect x="18" y="170" width="14" height="6" rx="2"/>
      <rect x="18" y="190" width="14" height="6" rx="2"/>

      <!-- Pins Right -->
      <rect x="208" y="50" width="14" height="6" rx="2"/>
      <rect x="208" y="70" width="14" height="6" rx="2"/>
      <rect x="208" y="90" width="14" height="6" rx="2"/>
      <rect x="208" y="110" width="14" height="6" rx="2"/>
      <rect x="208" y="130" width="14" height="6" rx="2"/>
      <rect x="208" y="150" width="14" height="6" rx="2"/>
      <rect x="208" y="170" width="14" height="6" rx="2"/>
      <rect x="208" y="190" width="14" height="6" rx="2"/>
    </g>

    <!-- Main Chip Body -->
    <rect x="30" y="30" width="180" height="180" rx="14" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#chipShadow)"/>
    <rect x="42" y="42" width="156" height="156" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>

    <!-- Circuit traces on die -->
    <path d="M 50 60 L 80 60 L 95 75 L 110 75" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 50 180 L 75 180 L 90 165 L 120 165" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 190 60 L 160 60 L 145 75 L 130 75" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 190 180 L 165 180 L 150 165 L 120 165" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- PostgreSQL Elephant Icon Stylized as CPU Core -->
    <g transform="translate(85, 75) scale(0.7)">
      <!-- Stylized Elephant Head -->
      <path d="M 50 10 C 25 10 10 30 10 55 C 10 75 22 90 35 95 C 32 105 28 115 18 120 C 35 120 50 105 55 92 C 60 92 65 92 70 90 C 85 90 98 75 98 55 C 98 30 75 10 50 10 Z" 
            fill="url(#pgGrad)" opacity="0.95"/>
      <!-- Ear Detail -->
      <path d="M 32 35 C 20 40 18 60 26 70 C 32 78 40 75 42 65 C 45 50 42 35 32 35 Z" 
            fill="#0f172a" opacity="0.5"/>
      <!-- Tusk -->
      <path d="M 38 90 C 32 98 25 102 18 102 C 22 95 28 88 35 85 Z" fill="#ffffff" opacity="0.9"/>
      <!-- Eye -->
      <circle cx="48" cy="42" r="4" fill="#38bdf8" filter="url(#cyanGlow)"/>
      <circle cx="48" cy="42" r="2" fill="#ffffff"/>
    </g>

    <!-- Chip Label -->
    <text x="120" y="185" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      x86-32 CORE
    </text>
  </g>

  <!-- Right: Typography & Feature Badges -->
  <g transform="translate(310, 75)">
    <!-- Tagline pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="0.5">
      RELATIONAL COMPILER ENGINE
    </text>

    <!-- Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      SQL<tspan fill="#38bdf8">Assembler</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
      The world's first <tspan fill="#f1f5f9" font-weight="600">ACID-compliant</tspan>, table-driven x86 compiler.
    </text>

    <!-- Pipeline flowchart pills -->
    <g transform="translate(0, 130)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="105" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52" y="18" font-family="'Consolas', monospace" font-size="10" fill="#64748b" text-anchor="middle">SOURCE</text>
      <text x="52" y="32" font-family="'Consolas', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">SQL Tables</text>

      <!-- Arrow 1 -->
      <path d="M 113 21 L 127 21 M 123 16 L 128 21 L 123 26" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Step 2 -->
      <rect x="135" y="0" width="115" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="192" y="18" font-family="'Consolas', monospace" font-size="10" fill="#64748b" text-anchor="middle">ASSEMBLER</text>
      <text x="192" y="32" font-family="'Consolas', monospace" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="bold">PL/pgSQL 2-Pass</text>

      <!-- Arrow 2 -->
      <path d="M 258 21 L 272 21 M 268 16 L 273 21 L 268 26" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Step 3 -->
      <rect x="280" y="0" width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="335" y="18" font-family="'Consolas', monospace" font-size="10" fill="#64748b" text-anchor="middle">PACKAGER</text>
      <text x="335" y="32" font-family="'Consolas', monospace" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="bold">wrap_in_elf32</text>

      <!-- Arrow 3 -->
      <path d="M 398 21 L 412 21 M 408 16 L 413 21 L 408 26" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Step 4 -->
      <rect x="420" y="0" width="125" height="42" rx="8" fill="#0f2b2b" stroke="#10b981" stroke-width="1.2"/>
      <text x="482" y="18" font-family="'Consolas', monospace" font-size="10" fill="#34d399" text-anchor="middle">OUTPUT</text>
      <text x="482" y="32" font-family="'Consolas', monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">Linux ELF32</text>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
        🛡️ ACID Rollback Safe
      </text>

      <rect x="140" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="205" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
        ⚡ Zero External Deps
      </text>

      <rect x="280" y="0" width="145" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="352" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
        🚀 Native CPU Executable
      </text>

      <rect x="435" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="490" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
        🇭🇺 🇬🇧 Bilingual
      </text>
    </g>
  </g>
</svg>
